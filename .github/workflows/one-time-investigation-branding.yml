name: One-time investigation branding update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-branding:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update investigation headers
        shell: python
        run: |
          from pathlib import Path

          updates = {
              'app/investigations/orders/page.tsx': [
                  (
                      '<div className="grid h-11 w-11 place-items-center rounded-xl border border-[#FDC823]/60 bg-[#082b61] text-lg font-black text-[#FDC823]">⚕</div>',
                      '<div className="grid h-11 w-11 place-items-center overflow-hidden rounded-xl border border-[#FDC823]/60 bg-white p-1 shadow-sm"><img src="/serawat-logo.png" alt="Serawat logo" className="h-full w-full object-contain" /></div>'
                  ),
                  (
                      'Serawat Advanced Multispeciality Joint & Spine Centre',
                      'Serawat Advanced Multispeciality Joint & Spine Centre'
                  ),
              ],
              'app/investigation-room/page.tsx': [
                  (
                      '<header className="flex flex-wrap items-center justify-between gap-4 rounded-[1.7rem] bg-[#031a38] p-5 text-white shadow-2xl"><Link href="/investigations" className="action nav">← Investigation Dashboard</Link><div><p className="eyebrow">SAMS · Laboratory</p><h1 className="text-xl font-black">Lab Room</h1></div><button className="action refresh" onClick={load}>↻ Refresh</button></header>',
                      '<header className="flex flex-wrap items-center justify-between gap-4 rounded-[1.7rem] bg-[#031a38] p-5 text-white shadow-2xl"><div className="flex min-w-0 items-center gap-3"><Link href="/investigations" className="action nav">← Investigation Dashboard</Link><div className="grid h-11 w-11 shrink-0 place-items-center overflow-hidden rounded-xl border border-[#FDC823]/60 bg-white p-1 shadow-sm"><img src="/serawat-logo.png" alt="Serawat logo" className="h-full w-full object-contain" /></div><div className="min-w-0"><p className="eyebrow">SAMS · Laboratory</p><p className="text-sm font-black text-white">Serawat Advanced Multispeciality Joint &amp; Spine Centre</p><h1 className="text-xl font-black">Lab Room</h1></div></div><button className="action refresh" onClick={load}>↻ Refresh</button></header>'
                  )
              ],
              'app/investigation-reports/page.tsx': [
                  (
                      '<div className="flex h-[76px] items-center gap-3 border-b border-white/10 px-5">\n          <div className="grid h-11 w-11 place-items-center rounded-xl bg-[#d6a443] text-2xl text-[#071a38]">⚕</div>',
                      '<div className="flex h-[76px] items-center gap-3 border-b border-white/10 px-5">\n          <div className="grid h-11 w-11 place-items-center overflow-hidden rounded-xl bg-white p-1"><img src="/serawat-logo.png" alt="Serawat logo" className="h-full w-full object-contain" /></div>'
                  ),
                  (
                      '<header className="no-print flex h-[76px] items-center justify-between border-b border-slate-200 bg-white px-5 shadow-sm sm:px-8">\n          <div><p className="text-[9px] font-black uppercase tracking-[.2em] text-[#d6a443]">SAMS · Laboratory</p><p className="mt-1 text-sm font-black text-[#082b61]">Serawat Advanced Multispeciality Joint &amp; Spine Centre</p></div>',
                      '<header className="no-print flex h-[76px] items-center justify-between border-b border-slate-200 bg-white px-5 shadow-sm sm:px-8">\n          <div className="flex min-w-0 items-center gap-3"><div className="grid h-12 w-12 shrink-0 place-items-center overflow-hidden rounded-xl border border-[#d6a443]/40 bg-white p-1 shadow-sm"><img src="/serawat-logo.png" alt="Serawat logo" className="h-full w-full object-contain" /></div><div className="min-w-0"><p className="text-[9px] font-black uppercase tracking-[.2em] text-[#d6a443]">SAMS · Laboratory</p><p className="mt-1 truncate text-sm font-black text-[#082b61]">Serawat Advanced Multispeciality Joint &amp; Spine Centre</p></div></div>'
                  )
              ],
          }

          changed = []
          for filename, replacements in updates.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  if old == new:
                      continue
                  if old not in text:
                      raise SystemExit(f'Expected branding block not found in {filename}')
                  text = text.replace(old, new, 1)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(filename)

          if len(changed) != 3:
              raise SystemExit(f'Expected 3 investigation pages to change, changed: {changed}')
          print('Updated:', ', '.join(changed))

      - name: Commit and remove one-time workflow
        run: |
          rm -f .github/workflows/one-time-investigation-branding.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/investigations/orders/page.tsx app/investigation-room/page.tsx app/investigation-reports/page.tsx .github/workflows/one-time-investigation-branding.yml
          git commit -m "update investigation branding headers"
          git push origin HEAD:main
