name: Connect OPD print button
on:
  push:
    branches: [sams-home-v2]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'fix: connect OPD print button to A4 A4 slip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch button
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sams-new/app/patients/profile/[id]/opd-slip/page.tsx')
          s=p.read_text()
          old='onClick={() => window.print()} className="rounded-xl border border-slate-200 bg-white px-6 py-3 text-sm font-black text-slate-600 transition hover:border-slate-300 hover:bg-slate-50">Print OPD Slip</button>'
          new='onClick={() => router.push(`/patients/profile/${patientId}/opd-slip/print?visitId=${createdVisit.id}`)} className="rounded-xl border border-slate-200 bg-white px-6 py-3 text-sm font-black text-slate-600 transition hover:border-slate-300 hover:bg-slate-50">Print OPD Slip</button>'
          if old not in s: raise SystemExit('Print OPD Slip button pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'sams-new/app/patients/profile/[id]/opd-slip/page.tsx' .github/workflows/connect-opd-print.yml
          git commit -m 'fix: connect OPD print button to A4 A4 slip'
          git push origin HEAD:sams-home-v2
