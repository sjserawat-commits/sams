name: Update SAMS Brand Name

on:
  push:
    branches: [sams-home-v2]

permissions:
  contents: write

jobs:
  rename-brand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sams-home-v2

      - name: Replace old SAMS branding in all tracked text files
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          import re

          old_variants = [
              "Serawat Advanced Musculoskeletal, Joint & Spine Centre",
              "SERAWAT ADVANCED MUSCULOSKELETAL, JOINT & SPINE CENTRE",
              "Serawat advance musculoskeletal-joint & spine Centre",
              "Serawat Advanced Musculoskeletal Joint & Spine Centre",
          ]
          new = "SAMS Serawat Advanced Multispecialty Joint & Spine Center"

          result = subprocess.run(
              ["git", "grep", "-Il", "Serawat"],
              text=True,
              capture_output=True,
              check=False,
          )

          changed = []
          for raw in result.stdout.splitlines():
              path = Path(raw)
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text
              for old in old_variants:
                  updated = re.sub(re.escape(old), new, updated, flags=re.IGNORECASE)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print("Updated files:")
          for path in changed:
              print(path)
          print(f"Total: {len(changed)}")
          PY

      - name: Commit and push branding update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: rename SAMS to Serawat Advanced Multispecialty Joint & Spine Center"
          git push origin sams-home-v2
          rm -f .github/workflows/rename-sams-brand.yml
          git add -A
          git commit -m "chore: remove one-time branding migration workflow"
          git push origin sams-home-v2
