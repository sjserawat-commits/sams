name: SAMS Safe DB Hardening

on:
  push:
    branches:
      - sams-safe-db-hardening
  pull_request:
    branches:
      - sams-safe-db-hardening
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
      SQLITE_DB_PATH: ci.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Create isolated CI database
        run: npx prisma db push --skip-generate

      - name: SQLite integrity check
        run: npm run db:integrity

      - name: SQLite data integrity audit
        run: npm run db:audit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Cleanup CI database
        if: always()
        run: rm -f ci.db ci.db-journal ci.db-shm ci.db-wal
