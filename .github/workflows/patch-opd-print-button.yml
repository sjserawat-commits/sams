name: Patch OPD print button

on:
  push:
    branches:
      - sams-home-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix: route OPD print button to final A4 slip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch button
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sams-new/app/patients/profile/[id]/opd-slip/page.tsx')
          s=p.read_text()
          old='onClick={() => window.print()}'
          new='onClick={() => router.push(`/patients/profile/${patientId}/opd-slip/print?visitId=${createdVisit?.id || ""}`)}'
          if old not in s:
              raise SystemExit('OPD print button handler not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'sams-new/app/patients/profile/[id]/opd-slip/page.tsx'
          git commit -m 'fix: route OPD print button to final A4 slip'
          git push origin HEAD:sams-home-v2
