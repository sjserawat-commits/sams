name: Repair Lab Room Syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair syntax and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/investigation-room/page.tsx')
          text = path.read_text(encoding='utf-8')
          bad = '\n </div>\n const summaryDetail=summaryOpen?summaryOrders(summaryOpen):[];'
          good = '\n const summaryDetail=summaryOpen?summaryOrders(summaryOpen):[];'
          changed = bad in text
          if changed:
              text = text.replace(bad, good, 1)
              path.write_text(text, encoding='utf-8')
              print('Removed stray closing div before summaryDetail.')
          else:
              print('Syntax repair already applied.')
          PY
          git rm .github/workflows/fix-lab-room-syntax.yml
          if git diff --quiet; then
            echo 'No source change; removing temporary workflow only.'
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/investigation-room/page.tsx
          git commit -m 'fix: remove stray closing div in Lab Room' || true
          git add -u .github/workflows/fix-lab-room-syntax.yml
          git commit -m 'chore: remove temporary Lab Room repair workflow' || true
          git push origin main
