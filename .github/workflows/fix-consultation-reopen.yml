name: Fix consultation reopen

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch reopen behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/patients/profile/[id]/consultation/page.tsx')
          text = path.read_text()

          old_sig = '  async function reload() {'
          new_sig = '  async function reload(reopen = false) {'
          if old_sig not in text:
              raise SystemExit('reload signature not found')
          text = text.replace(old_sig, new_sig, 1)

          old_guard = '    if (!visitId) return;\n    try {'
          new_guard = '''    if (!visitId) return;
    try {
      if (reopen) {
        const reopenResponse = await fetch(`/api/opd/${visitId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: "IN_CONSULTATION", reopen: true }),
        });
        const reopenData = await reopenResponse.json();
        if (!reopenResponse.ok) throw new Error(reopenData?.error || "Unable to reopen consultation.");
        setFinalized(false);
        setVisit(reopenData);
        setMessage("Saved consultation reopened. You can continue editing.");
      }'''
          if old_guard not in text:
              raise SystemExit('reload guard not found')
          text = text.replace(old_guard, new_guard, 1)

          old_button = '<button type="button" onClick={reload} disabled={!visitId} className="rounded-xl border border-[#0b63ce] bg-white px-4 py-3 text-xs font-black text-[#0b63ce]">↻ Reopen Saved Consultation</button>'
          new_button = '<button type="button" onClick={() => reload(true)} disabled={!visitId || saving || finalizing} className="rounded-xl border border-[#0b63ce] bg-white px-4 py-3 text-xs font-black text-[#0b63ce]">↻ Reopen Saved Consultation</button>'
          if old_button not in text:
              raise SystemExit('reopen button not found')
          text = text.replace(old_button, new_button, 1)

          path.write_text(text)
          PY

      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-consultation-reopen.yml
          git add app/patients/profile/'[id]'/consultation/page.tsx .github/workflows/fix-consultation-reopen.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix consultation reopen saved workflow"
          git push